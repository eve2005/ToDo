version: '3.8'
services:
  db:
    image: mysql:8.4
    container_name: banco_ToDo
    environment:
      MYSQL_DATABASE: ToDo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build:
      context: ./api
    container_name: api_ToDo
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ToDo
      - DB_USERNAME=root
      - DB_PASSWORD=root 
  
  frontend:
    build:
      context: ./frontend
    container_name: frontend_ToDo
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app       
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  db_data: